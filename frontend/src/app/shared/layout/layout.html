<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="logo.svg" alt="Logo de TecnoFix" />
      <div>
        <span class="brand-name">TecnoFix</span>
        <span class="brand-sub">Servicio técnico</span>
      </div>
    </div>

    <ul class="sidebar-menu" aria-label="Menú principal">
      @for (opcion of opciones(); track opcion.ruta) {
        <li>
          <a
            class="side-link"
            [routerLink]="opcion.ruta"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i [class]="'bi ' + opcion.icono" aria-hidden="true"></i>
            <span>{{ opcion.texto }}</span>
          </a>
        </li>
      }
    </ul>

    <div class="sidebar-user">
      <span class="avatar" aria-hidden="true">{{ inicial() }}</span>
      <span class="user-info">
        <span class="user-name">{{ usuario()?.nombre }}</span>
        <span class="user-rol">{{ rolEtiqueta() }}</span>
      </span>
      <button type="button" class="btn btn-sm btn-salir" (click)="salir()">
        <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Salir
      </button>
    </div>
  </aside>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
