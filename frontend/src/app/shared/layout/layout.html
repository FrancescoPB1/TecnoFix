<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand mb-0 h1">TecnoFix <small class="text-white-50 fs-6">Servicio técnico</small></span>
  <div class="d-flex align-items-center gap-3">
    <span class="text-white-50 small">{{ usuario()?.nombre }} · {{ rolEtiqueta() }}</span>
    <button type="button" class="btn btn-outline-light btn-sm" (click)="salir()">Salir</button>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <aside class="col-md-3 col-lg-2 bg-white border-end py-3">
      <ul class="nav nav-pills flex-md-column gap-1" aria-label="Menú principal">
        @for (opcion of opciones(); track opcion.ruta) {
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="opcion.ruta"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              >{{ opcion.texto }}</a
            >
          </li>
        }
      </ul>
    </aside>

    <main class="col-md-9 col-lg-10 py-4 px-md-4">
      <router-outlet />
    </main>
  </div>
</div>
